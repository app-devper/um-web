steps:
  - name: node:20
    entrypoint: npm
    args: [ci]
  - name: node:20
    entrypoint: npm
    args: [run, build]
    env:
      - NEXT_PUBLIC_API_URL=https://devper-um-1056670356976.asia-southeast1.run.app
  - name: node:20
    entrypoint: npx
    args:
      - firebase-tools
      - deploy
      - --only
      - hosting:devper-um
      - --project
      - devperpos
      - --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
